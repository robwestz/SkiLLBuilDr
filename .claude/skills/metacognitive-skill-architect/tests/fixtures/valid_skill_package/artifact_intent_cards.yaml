artifact_name: manifest.yaml
artifact_path: .claude/skills/valid_skill_package/manifest.yaml
artifact_type: config
why_this_artifact_must_exist: Declares the file inventory the validator checks for parity.
problem_it_prevents: Manifest drift where files and declarations disagree.
future_artifact_or_workflow_it_enables: The G4 parity check in validate_skill_package.mjs.
intended_consumer: [validation_script, future_agent]
required_inputs: The list of files shipped by this fixture.
expected_outputs: A manifest whose entries match the files on disk.
interface_contract: A files: block plus an artifact_intent_cards: pointer.
definition_of_done: Every listed file exists and every file on disk is listed.
validation_method: validate_skill_package.mjs parity check on this fixture.
failure_modes: Listing a phantom file or omitting a real one.
what_should_not_be_included: Build metadata unrelated to file inventory.
downstream_snowball_effect: Lets validate_skill_package.mjs prove parity on the PASS fixture.
assumptions: Manifest is the single source of declared inventory.
