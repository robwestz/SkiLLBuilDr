# ============================ Commit 4 (validators + tests) ============================

---
artifact_name: validate_skill_package.mjs
artifact_path: .claude/skills/metacognitive-skill-architect/scripts/validate_skill_package.mjs
artifact_type: script
why_this_artifact_must_exist: Automates gates G1/G2/G3/G4/G7 so package quality is machine-checked, not eyeballed.
problem_it_prevents: Manual gate checks drifting or being skipped under time pressure.
future_artifact_or_workflow_it_enables: The pre-commit grind and CI check for every future skill.
intended_consumer: [validation_script, future_agent, CLI_workflow, test_runner]
required_inputs: A skill package dir with manifest.yaml and artifact_intent_cards.yaml.
expected_outputs: PASS (exit 0) or FAIL (exit 1) with one line per problem.
interface_contract: CLI arg = package dir; exported validatePackage(root) returns {errors}.
definition_of_done: Exits 0 on valid_skill_package, non-zero on invalid_skill_package, and self-validates this skill.
validation_method: tests/test_validate_skill_package.mjs via node --test.
failure_modes: False positives on legitimate files; missing a real orphan/phantom.
what_should_not_be_included: Any third-party dependency; network or write access.
assumptions: Dependency-free Node ESM; manifest stays flat per the standard.
downstream_snowball_effect: Turns process_standard gates into a reusable executable check for Skill #1+.

---
artifact_name: validate_artifact_cards.mjs
artifact_path: .claude/skills/metacognitive-skill-architect/scripts/validate_artifact_cards.mjs
artifact_type: script
