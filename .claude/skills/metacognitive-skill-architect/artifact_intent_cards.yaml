problem_it_prevents: Cards that look filled but contain placeholders or out-of-enum values.
future_artifact_or_workflow_it_enables: The create-time gate and validate_skill_package G3 reuse.
intended_consumer: [validation_script, future_agent, test_runner]
required_inputs: An artifact_intent_cards.yaml file (one document per card).
expected_outputs: PASS (exit 0) or FAIL (exit 1) listing each invalid field.
interface_contract: CLI arg = cards file; exports parseCards, validateCard, validateCardsFile.
definition_of_done: Exits 0 on valid fixture cards, non-zero when any required field is missing/placeholder/out-of-enum.
validation_method: tests/test_validate_artifact_cards.mjs via node --test.
failure_modes: Parser mishandling inline comments or list values.
what_should_not_be_included: A full YAML library; deep-nesting support.
assumptions: Cards are flat and line-oriented per the AIC standard.
downstream_snowball_effect: Lets validate_skill_package reuse one card validator across all skills.

