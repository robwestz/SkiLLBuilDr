artifact_name: reference.md.template
artifact_path: .claude/skills/metacognitive-skill-architect/templates/new_reference/reference.md.template
artifact_type: template
why_this_artifact_must_exist: Scaffolds a typed, DoD-aware reference so references stay first-class.
