problem_it_prevents: References degrading into decorative filler with no quality bar.
future_artifact_or_workflow_it_enables: templates/new_reference/reference.md.template and the validator's reference checks.
intended_consumer: [human, future_agent, future_skill, validation_script]
required_inputs: The broad references definition (templates, fixtures, anti-examples, schemas, ...).
expected_outputs: A taxonomy of reference types plus a minimum DoD and validation signal per type.
