# Artifact Intent Cards for metacognitive-skill-architect's own files.
# This is dogfood: Skill #0 documents its own artifacts under its own gate.
# Schema + pass/fail rules: references/artifact_intent_card_standard.md
# Validated by scripts/validate_artifact_cards.mjs (Commit 4).

# ============================ Commit 1 (meta-spec) ============================

artifact_name: ASSUMPTIONS.md
artifact_path: .claude/skills/metacognitive-skill-architect/ASSUMPTIONS.md
artifact_type: doc
why_this_artifact_must_exist: Centralizes every inheritable architecture/format/validation decision so future skills do not re-discover them.
problem_it_prevents: Silent assumptions that later prove wrong and force expensive rework in Skill #1+.
future_artifact_or_workflow_it_enables: Every later artifact can reference or challenge a recorded assumption instead of guessing.
intended_consumer: [human, future_agent, future_skill]
required_inputs: Decisions taken this session (repo choice, dependency-free policy, GPU-free profile).
expected_outputs: A status-tagged table of assumptions (locked | revisit_required) with affected scope.
interface_contract: Markdown table; each row = {assumption, rationale, status, affects}.
definition_of_done: All session architecture/format/validation assumptions are listed and status-tagged.
validation_method: Manual checklist now; later cross-checked against manifest by validate_skill_package.
failure_modes: Becomes a dumping ground without status, or is documented but not followed.
what_should_not_be_included: Implementation detail, code, task todo lists.
assumptions: Assumptions change over time, hence the status field and revisit log.
downstream_snowball_effect: Skill #1 starts from a known foundation instead of re-deriving decisions.

---
artifact_name: skill_standard.md
artifact_path: .claude/skills/metacognitive-skill-architect/references/skill_standard.md
artifact_type: reference
why_this_artifact_must_exist: Defines what a skill is and its minimum Definition of Done (system-DoD #1).
problem_it_prevents: Inconsistent, half-finished skills with no shared baseline.
future_artifact_or_workflow_it_enables: templates/new_skill/SKILL.md.template and scripts/validate_skill_package.mjs.
intended_consumer: [human, future_agent, future_skill, validation_script]
required_inputs: Existing repo SKILL.md frontmatter convention; the skill definition.
expected_outputs: Canonical skill anatomy + mandatory SKILL.md sections + DoD checklist.
interface_contract: Numbered section list the validator maps 1:1 to file checks.
definition_of_done: A novice can read it and know exactly what a complete skill requires.
validation_method: Cross-checked against example_good_skill (Commit 3) and validate_skill_package (Commit 4).
failure_modes: Too abstract to validate against; or duplicates skill-development without referencing it.
what_should_not_be_included: Domain-specific examples (those live in examples/).
assumptions: SKILL.md with YAML frontmatter is the format (repo convention).
downstream_snowball_effect: Every future skill is measured against one source instead of ad-hoc judgment.

