# Artifact Intent Cards for session-kickoff-orchestrator (Skill #1).
# One document per artifact, separated by '---'. Validated by
# metacognitive-skill-architect/scripts/validate_artifact_cards.mjs (G3).

---
artifact_name: SKILL.md
artifact_path: .claude/skills/session-kickoff-orchestrator/SKILL.md
artifact_type: skill
why_this_artifact_must_exist: It is the contract that makes the kickoff ritual a discoverable, rankable skill.
problem_it_prevents: Ad-hoc, undocumented session-start steps that drift and cannot be validated.
future_artifact_or_workflow_it_enables: The blueprint session-start hook and the v2 model-council extension.
intended_consumer: [human, Claude, future_agent, validation_script]
required_inputs: skill_standard.md structure; the kickoff behaviour defined in scripts/kickoff.mjs.
expected_outputs: A SKILL.md with all 9 required elements and a kebab-case name matching the directory.
interface_contract: Frontmatter name/description plus the six required H2 sections.
definition_of_done: validate_skill_package.mjs reports no SKILL.md structural errors.
validation_method: validate_skill_package.mjs against this package.
failure_modes: Description over 200 chars; a missing required heading; name not matching the directory.
what_should_not_be_included: Implementation code or model-council (v2) instructions.
assumptions: SKILL.md with YAML frontmatter is the format (Skill #0 convention).
downstream_snowball_effect: Lets the catalog ranker surface this skill so future sessions auto-run the kickoff.

---
artifact_name: README.md
artifact_path: .claude/skills/session-kickoff-orchestrator/README.md
artifact_type: doc
why_this_artifact_must_exist: Gives a human the run commands and the why before reading the code.
problem_it_prevents: An operator not knowing how to invoke the kickoff or what v1 deliberately excludes.
future_artifact_or_workflow_it_enables: Onboarding of the operator to the session-start ritual.
intended_consumer: [human]
required_inputs: The CLI usage of scripts/kickoff.mjs and the v1/v2 scope split.
expected_outputs: A short orientation doc with copy-pasteable run commands.
interface_contract: Markdown with a Run-it section and a v1-scope section.
definition_of_done: A novice can run the kickoff from the README alone.
validation_method: Manual checklist; commands copy-run without edits.
failure_modes: Stale commands that drift from the actual CLI flags.
what_should_not_be_included: Field-by-field API docs (those live in code comments).
assumptions: Run from repo root with node >= 18.
downstream_snowball_effect: Reduces ramp time for wiring kickoff.mjs into the blueprint.

