---
artifact_name: kickoff.mjs
artifact_path: .claude/skills/session-kickoff-orchestrator/scripts/kickoff.mjs
artifact_type: script
why_this_artifact_must_exist: It is the deterministic engine that performs the health-check and knowledge-load.
problem_it_prevents: Starting a session blind to lockfile drift, a dirty tree, or carry-over tasks.
future_artifact_or_workflow_it_enables: The blueprint session-start hook and the v2 model-council layer.
intended_consumer: [CLI_workflow, future_agent, test_runner]
required_inputs: A repo root; package.json, package-lock.json, .agents/TASKS.json, ASSUMPTIONS files, git metadata.
expected_outputs: A Session Intent Card printed to stdout, optionally written under .agents/kickoffs/.
interface_contract: Exported pure functions (detectLockfileDrift, parsePorcelain, parseRevisitAssumptions, parseOpenTasks, renderCard) plus a CLI main.
definition_of_done: node --test passes and the CLI prints a card; zero runtime deps.
validation_method: tests/kickoff.test.mjs via node --test; G7 import hygiene.
failure_modes: A crash on missing files; a false GREEN when drift exists.
what_should_not_be_included: Any network or model API call (v2 concern).
assumptions: Lockfile drift is presence-based; the process exits 0 even on health problems.
downstream_snowball_effect: Produces the Session Intent Card that the next session's kickoff links as previous card.

---
artifact_name: kickoff.test.mjs
artifact_path: .claude/skills/session-kickoff-orchestrator/tests/kickoff.test.mjs
artifact_type: test
why_this_artifact_must_exist: Proves the deterministic core behaves, especially drift detection.
problem_it_prevents: Regressions that would let the kickoff miss drift or mislabel health.
future_artifact_or_workflow_it_enables: Safe extension of kickoff.mjs toward the v2 council.
intended_consumer: [test_runner, future_agent]
required_inputs: The exported pure functions of scripts/kickoff.mjs.
expected_outputs: node --test cases asserting drift, porcelain, task, assumption, and render behaviour.
interface_contract: node:test + node:assert, importing only from ../scripts/kickoff.mjs.
definition_of_done: node --test tests/*.test.mjs is green with zero dependencies.
validation_method: node --test run locally and in CI.
failure_modes: Testing the CLI/git instead of pure functions, making tests flaky.
what_should_not_be_included: Real git or filesystem fixtures (pure-function inputs only).
assumptions: Pure functions accept strings so tests stay deterministic.
downstream_snowball_effect: Guards detectLockfileDrift so the v2 council can rely on a trusted health core.

