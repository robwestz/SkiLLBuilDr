validation_method: Manual checklist against renderCard output.
failure_modes: Drifting from renderCard so the template misleads.
what_should_not_be_included: Live data or logic.
assumptions: The card stays markdown for human and agent readability.
downstream_snowball_effect: Gives the v2 council a known card schema to append model findings to.
