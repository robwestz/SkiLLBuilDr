artifact_name: session_intent_card.md.template
artifact_path: .claude/skills/session-kickoff-orchestrator/templates/session_intent_card.md.template
artifact_type: template
why_this_artifact_must_exist: Documents the canonical shape of the card renderCard emits.
problem_it_prevents: Divergent, hand-rolled session cards that cannot be compared across sessions.
future_artifact_or_workflow_it_enables: A stable card format the v2 council and dashboards can extend.
intended_consumer: [human, future_agent]
required_inputs: The sections produced by renderCard in scripts/kickoff.mjs.
expected_outputs: A markdown template with placeholders for every rendered field.
interface_contract: Headed sections (health, knowledge, suggested focus) matching renderCard output.
